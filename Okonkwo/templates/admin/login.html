{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;

            min-height: 100%;

            margin: 0;

            padding: 0;

        }


        body {

            min-height: 100vh;

            background: #000000;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =====================================================
           FULL SCREEN LOGIN AREA
        ===================================================== */

        .admin-login-page {

            width: 100%;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        /* =====================================================
           LOGIN SECTION
        ===================================================== */

        .admin-login-section {

            width: 100%;

            max-width: 400px;

            padding: 40px;

            background: #111111;

            border: 1px solid #333333;

            border-radius: 12px;

        }


        /* =====================================================
           HEADING
        ===================================================== */

        .admin-login-section h1 {

            margin: 0 0 30px;

            padding: 0;

            text-align: center;

            color: #ffffff;

            font-size: 28px;

            font-weight: 700;

        }


        /* =====================================================
           FORM
        ===================================================== */

        .admin-login-form {

            width: 100%;

            margin: 0;

            padding: 0;

        }


        /* =====================================================
           FORM GROUP
        ===================================================== */

        .login-form-group {

            width: 100%;

            margin-bottom: 20px;

        }


        /* =====================================================
           LABEL
        ===================================================== */

        .login-form-group label {

            display: block;

            margin-bottom: 8px;

            color: #ffffff;

            font-size: 14px;

            font-weight: 600;

        }


        /* =====================================================
           INPUT
        ===================================================== */

        .login-form-group input {

            width: 100%;

            height: 48px;

            padding: 0 14px;

            border: 1px solid #444444;

            border-radius: 7px;

            background: #ffffff;

            color: #111111;

            font-size: 15px;

            outline: none;

        }


        .login-form-group input:focus {

            border-color: #ffffff;

        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-button {

            width: 100%;

            height: 48px;

            margin-top: 5px;

            padding: 0;

            border: none;

            border-radius: 7px;

            background: #ffffff;

            color: #000000;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

        }


        .login-button:hover {

            background: #dddddd;

        }


        /* =====================================================
           ERROR
        ===================================================== */

        .login-error {

            margin-bottom: 20px;

            padding: 12px;

            border: 1px solid #702020;

            border-radius: 7px;

            background: #260d0d;

            color: #ffb3b3;

            font-size: 13px;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .admin-login-page {

                padding: 15px;

            }


            .admin-login-section {

                max-width: 100%;

                padding: 30px 22px;

            }


            .admin-login-section h1 {

                font-size: 25px;

                margin-bottom: 28px;

            }

        }


        @media (max-width: 380px) {

            .admin-login-section {

                padding: 25px 18px;

            }


            .admin-login-section h1 {

                font-size: 23px;

            }

        }

    </style>

</head>


<body>


    <main class="admin-login-page">


        <section class="admin-login-section">


            <h1>
                ADMIN LOGIN
            </h1>


            {% if form.errors %}

                <div class="login-error">

                    Please enter a correct username and password.

                </div>

            {% endif %}


            <form
                method="post"
                action="{{ app_path }}"
                class="admin-login-form"
            >

                {% csrf_token %}


                <!-- USERNAME -->

                <div class="login-form-group">

                    <label
                        for="{{ form.username.id_for_label }}"
                    >

                        Username or Email

                    </label>

                    {{ form.username }}

                </div>


                <!-- PASSWORD -->

                <div class="login-form-group">

                    <label
                        for="{{ form.password.id_for_label }}"
                    >

                        Password

                    </label>

                    {{ form.password }}

                </div>


                <input
                    type="hidden"
                    name="next"
                    value="{{ next }}"
                >


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-button"
                >

                    Log in

                </button>

            </form>


        </section>


    </main>


</body>

</html>
